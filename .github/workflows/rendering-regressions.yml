name: Rendering regressions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rendering:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      # 한글을 대체 글리프로 재면 차트 라벨 폭과 문서 높이가 실제 화면과 달라진다.
      - name: Install Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match :lang=ko
      # Hosted runner의 Chrome을 실제로 실행하며, 누락 시 검사는 실패한다.
      - run: npm --prefix frontend run test:regression

  backend:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-${{ hashFiles('backend/Cargo.lock') }}
      # DB·LLM·Oracle 없이 도는 검사만 실행한다. MariaDB·Oracle 통합 검사는 환경변수
      # (LLM_AGENT_TEST_MARIADB·LLM_AGENT_TEST_ORACLE)가 있을 때만 돈다 — README '검사' 참고.
      - run: cargo test --manifest-path backend/Cargo.toml
