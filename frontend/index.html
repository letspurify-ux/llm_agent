<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPACE Assistant</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --surface: #ffffff;
        --border: #e4e9f2;
        --text: #1a2233;
        --muted: #67728a;
        --accent: #4f46e5;
        --accent-2: #7c3aed;
        --grad: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif;
        background:
          radial-gradient(1200px 500px at 80% -10%, #e4e0ff 0%, transparent 60%),
          radial-gradient(900px 400px at -10% 20%, #dceafe 0%, transparent 55%),
          var(--bg);
        color: var(--text);
      }

      .app { display: flex; flex-direction: column; height: 100%; }

      /* ===== 헤더 ===== */
      .header {
        display: flex; align-items: center; gap: 12px;
        padding: 14px 24px;
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        position: sticky; top: 0; z-index: 10;
      }
      .logo {
        width: 40px; height: 40px; border-radius: 12px;
        background: var(--grad);
        display: flex; align-items: center; justify-content: center;
        font-size: 19px; font-weight: 800; color: #fff;
        box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
      }
      .header h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.2px; }
      .header h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .header p { margin: 1px 0 0; font-size: 12px; color: var(--muted); }

      /* ===== 채팅 영역 ===== */
      .chat {
        flex: 1; overflow-y: auto;
        width: 100%; max-width: 820px; margin: 0 auto;
        padding: 24px 20px 8px;
        display: flex; flex-direction: column; gap: 16px;
      }

      .empty { margin: auto; text-align: center; padding: 40px 0; }
      .empty-icon {
        width: 72px; height: 72px; border-radius: 22px; margin: 0 auto 16px;
        background: var(--grad); display: flex; align-items: center; justify-content: center;
        font-size: 32px; font-weight: 800; color: #fff;
        box-shadow: 0 10px 30px rgba(79, 70, 229, 0.35);
      }
      .empty h2 { margin: 0 0 6px; font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
      .empty p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
      .chip {
        border: 1px solid var(--border); background: var(--surface); color: var(--text);
        padding: 9px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
        box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06);
        transition: all 0.15s ease;
      }
      .chip:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

      /* ===== 메시지 ===== */
      .row { display: flex; }
      .row.user { justify-content: flex-end; }
      .bubble {
        max-width: 78%; padding: 12px 16px; font-size: 14px; line-height: 1.6;
        /* 말풍선 '상자'는 max-width로 묶이지만 내용은 그렇지 않다 — URL·식별자처럼 공백 없는
           긴 토큰은 기본값(overflow-wrap: normal)에서 줄바꿈 지점이 없어 상자를 그대로 뚫고 나간다.
           표준은 anywhere지만 Safari 15.4 미만은 모르므로, 구형에서도 같은 효과를 내는
           word-break를 앞에 함께 둔다 (지원 범위는 App.jsx의 빌드 타깃 주석 참고). */
        word-break: break-word;
        overflow-wrap: anywhere;
        /* 최후의 그물. 위 규칙들과 코드블록·표·별행수식의 가로 스크롤이 실제 사례를 모두 덮지만,
           끊을 수도 스크롤할 수도 없는 내용(넓은 인라인 수식 등)이 오면 여전히 말풍선을 뚫는다 —
           그런 것은 잘라서라도 상자 안에 가둔다. 세로로 뚫는 것(\rule{500em})은 여기서 못 막는다
           (clip은 가로만 자른다) — 그쪽은 KaTeX의 maxSize가 막는다 (math.js).
           auto가 아니라 clip인 이유: auto는 세로 overflow까지 visible이 아니게 만들어 인라인
           수식의 위아래가 잘리고 스크롤바가 생긴다. clip은 가로만 자르고 세로는 건드리지 않는다.
           Safari 16 미만은 clip을 모르고 무시한다 — 그 경우 이전과 같이 동작할 뿐 나빠지지 않는다. */
        overflow-x: clip;
        animation: pop 0.18s ease;
      }
      @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .bubble.user {
        background: var(--grad); color: #fff;
        border-radius: 18px 18px 4px 18px;
        box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
        white-space: pre-wrap;
      }
      .bubble.assistant {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 18px 18px 18px 4px;
        box-shadow: 0 2px 10px rgba(16, 24, 40, 0.05);
      }

      /* assistant 말풍선 안의 markdown */
      .md p { margin: 0 0 8px; }
      .md h1, .md h2, .md h3 { margin: 12px 0 6px; font-size: 14px; font-weight: 700; color: var(--accent); }
      .md ul, .md ol { margin: 4px 0 8px; padding-left: 20px; }
      .md table { border-collapse: collapse; margin: 8px 0; display: block; overflow-x: auto; }
      .md th, .md td { border: 1px solid var(--border); padding: 6px 12px; font-size: 13px; text-align: left; white-space: nowrap; }
      .md th { background: #f1f3fb; font-weight: 600; }
      .md tr:nth-child(even) td { background: #fafbfe; }
      .md code { background: #eef0fa; padding: 1px 6px; border-radius: 5px; font-size: 12.5px; }
      /* 코드블록(```). 이 규칙이 없으면 <pre> 기본값(white-space: pre)대로 한 줄을 끝까지 늘여
         말풍선 밖으로 수백 px 삐져나간다 — 위의 줄바꿈 규칙은 pre에 닿지 않으므로
         (줄바꿈을 막는 것이 pre의 정의다) 대신 가로 스크롤로 가둔다. .trace pre와 같은 처방이다. */
      .md pre {
        margin: 8px 0; padding: 10px 12px; border-radius: 10px;
        background: #f1f3fb; border: 1px solid var(--border);
        overflow-x: auto; font-size: 12.5px; line-height: 1.5;
      }
      /* 블록 안의 code에는 인라인용 알약 배경·여백을 걷어낸다 — 두 배경이 겹쳐 얼룩덜룩해진다 */
      .md pre code { background: none; padding: 0; border-radius: 0; font-size: inherit; }
      .md img { max-width: 100%; }

      /* ===== 수식 (KaTeX) ===== */
      /* .bubble의 줄바꿈 규칙(overflow-wrap: anywhere)이 여기까지 상속되면, KaTeX가 span으로
         조립한 수식을 기호 한가운데서 끊어 분수·근호가 어긋난 채 렌더된다 — 수식 안에서만 되돌린다. */
      .md .katex { word-break: normal; overflow-wrap: normal; }
      /* 폭이 말풍선을 넘는 '인라인' 수식은 CSS로 접거나 스크롤시킬 수 없다. 세 가지를 다 재봤고
         전부 다른 것을 망가뜨렸다:
           - .katex를 inline-block+overflow로 → 기준선이 바뀌어 문장 속 수식이 전부 5px 들려 올라간다.
           - .md p에 overflow-x: auto  → overflow-y까지 visible이 아니게 되어 분수·합기호의 위아래가 잘린다.
           - .katex .text에 white-space: normal → KaTeX가 글자마다 span을 두므로 한 글자씩 줄바꿈된다.
         KaTeX가 .base에 white-space: nowrap을 걸어 두는 한 인라인 수식은 통째로 한 덩어리다.
         그래서 넓은 수식은 별행($$)으로 쓰게 하고(백엔드 시스템 프롬프트), 그래도 넘치는 것은
         위 .bubble의 overflow-x: clip이 상자 안에 가둔다. */
      /* 별행 수식($$)은 말풍선보다 넓어질 수 있다. 코드블록·표와 같은 처방으로 가로 스크롤에 가둔다.
         세로 여백은 남긴다 — 적분·행렬처럼 키 큰 수식이 위아래로 잘리는 것을 막는다.
         아래 여백이 위보다 두꺼운 이유: 가로 스크롤바가 생기면 그 두께(윈도우·리눅스는 겹치지 않는
         고전 스크롤바라 15px 안팎)를 패딩 상자 안에서 가져간다. overflow-y: hidden이라 상자는
         늘어날 수 없으므로, 여백이 얇으면 분수의 분모나 ∑의 아래 첨자가 스크롤바에 잘린다
         — 이 패딩이 막으려던 바로 그 손상이 스크롤바 쪽 문으로 되돌아온다. */
      .md .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0 16px; margin: 10px 0 0; }
      /* 문법이 틀린 수식을 KaTeX가 붉게 남기는 경로는 둘이다. 파싱 자체가 실패하면 원문 전체가
         .katex-error로 나오지만, 모르는 명령(\foobar)은 .katex '안'에 붉은 글자로 들어간다.
         뒤쪽은 위의 word-break: normal이 걸려 있어 긴 명령 이름이 줄바꿈되지 않고,
         .bubble의 overflow-x: clip에 잘려 아무것도 안 보이게 된다 — 두 경로 모두 접히게 한다.
         색 값은 math.js의 errorColor와 짝이다(한쪽만 바꾸면 이 규칙이 조용히 안 걸린다). */
      .md .katex-error { word-break: break-word; overflow-wrap: anywhere; }
      .md .katex [style*="#cc0000"] { white-space: normal; word-break: break-all; }
      .md > :first-child { margin-top: 0; }
      .md > :last-child { margin-bottom: 0; }

      /* ===== 쿼리 trace ===== */
      .trace { margin-top: 10px; font-size: 12px; }
      .trace summary {
        cursor: pointer; color: var(--muted); user-select: none;
        display: inline-flex; align-items: center; gap: 6px;
        padding: 4px 10px; border-radius: 999px; background: #f1f3fb;
      }
      .trace summary:hover { color: var(--accent); }
      .trace pre {
        margin: 6px 0 0; padding: 8px 10px; border-radius: 10px;
        background: #0f172a; color: #c7d2fe; overflow-x: auto;
        font-size: 11.5px; line-height: 1.5;
      }

      /* ===== 타이핑 인디케이터 ===== */
      .typing { display: flex; gap: 5px; padding: 6px 2px; }
      .typing i {
        width: 7px; height: 7px; border-radius: 50%; background: #a5b4fc;
        animation: blink 1.2s infinite;
      }
      .typing i:nth-child(2) { animation-delay: 0.2s; }
      .typing i:nth-child(3) { animation-delay: 0.4s; }
      @keyframes blink { 0%, 70%, 100% { opacity: 0.25; transform: none; } 35% { opacity: 1; transform: translateY(-3px); } }

      /* ===== 입력창 ===== */
      .composer-wrap { padding: 12px 20px 20px; }
      .composer {
        /* 여러 줄로 자란 뒤에도 보내기 단추는 맨 아래 줄에 붙어 있게 한다(center면 가운데로 떠오른다). */
        display: flex; align-items: flex-end; gap: 8px;
        width: 100%; max-width: 820px; margin: 0 auto;
        background: var(--surface); border: 1px solid var(--border);
        /* 999px(알약)이 아닌 이유: 여러 줄로 자라면 그 곡률이 상자 높이의 절반까지 커져
           입력창이 타원처럼 보인다. 한 줄일 때의 모습은 이 값으로도 거의 같다(높이 54px → 곡률 27px). */
        border-radius: 24px; padding: 6px 6px 6px 20px;
        box-shadow: 0 8px 30px rgba(16, 24, 40, 0.09);
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .composer:focus-within { border-color: var(--accent); box-shadow: 0 8px 30px rgba(79, 70, 229, 0.18); }
      .composer textarea {
        flex: 1; border: none; outline: none; background: transparent;
        font-size: 14.5px; color: var(--text); font-family: inherit;
        /* 높이는 App.jsx가 내용에 맞춰 직접 준다. 여기서 정하는 것은 한 줄일 때의 크기(padding+line-height로
           보내기 단추와 같은 42px)와 여기까지만 자란다는 한계뿐이다. 그 뒤로는 안에서 스크롤된다. */
        /* overflow-y는 App.jsx가 max-height에 걸렸을 때만 auto로 바꾼다 — 여기서는 꺼 둔다. */
        line-height: 1.5; padding: 10px 0; max-height: 160px; overflow-y: hidden;
        /* 높이가 자동이므로 사용자가 끄트머리를 끌어 늘리는 손잡이는 거짓말이 된다 — 없앤다. */
        resize: none;
      }
      .composer textarea::placeholder { color: #9aa4bd; }
      .send {
        width: 42px; height: 42px; border-radius: 50%; border: none; flex-shrink: 0;
        background: var(--grad); color: #fff; font-size: 17px; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
        transition: transform 0.12s ease, opacity 0.15s ease;
      }
      .send:hover:not(:disabled) { transform: scale(1.06); }
      .send:disabled { opacity: 0.35; cursor: default; box-shadow: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
